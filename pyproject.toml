[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trueform"
version = "0.1.0"
description = "Word-safe punctuation and capitalization restoration for raw English text"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "torch==2.14.1",
    "transformers==5.19.0",
    "tokenizers==0.23.3",
    "safetensors==0.8.0",
    "huggingface_hub==2.2.0",
    "numpy==2.5.4",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
llm = ["peft==0.21.2", "accelerate==1.15.0"]
data = ["pyarrow==26.0.0"]
dev = ["pytest==9.1.1"]

[project.scripts]
trueform = "trueform.cli:main"

[tool.setuptools]
packages = ["trueform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
